name: End-to-end tests

# API (REST Assured) and UI (Playwright) suites against a local stack: Supabase CLI
# (real Auth + Postgres + Mailpit), the backend jar on :8080 and Vite on :3000.
# Separate from build.yml on purpose: it never gates the build or the Sonar analysis.
# See docs/qa/e2e.md.

on:
  push:
    branches:
      - main
      - feature/qa-unit-tests
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: API and UI end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Start the local stack
        run: scripts/e2e/stack.sh up

      - name: Export the stack variables
        run: scripts/e2e/stack.sh env | sed 's/^export //' >> "$GITHUB_ENV"

      - name: API end-to-end suite
        run: ./mvnw -B -Pe2e verify

      - name: Install the front and Chromium
        if: ${{ !cancelled() }}
        working-directory: front
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: UI end-to-end suite
        if: ${{ !cancelled() }}
        working-directory: front
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            target/failsafe-reports/
            target/e2e/backend.log
            front/playwright-report/
            front/test-results/
          retention-days: 14

      - name: Stop the local stack
        if: ${{ always() }}
        run: scripts/e2e/stack.sh down
