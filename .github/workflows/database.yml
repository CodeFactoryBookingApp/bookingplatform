name: database

# Comprobación automática del modelo de datos.
# El caso exige "integrar mediante pull request, revisión por pares y
# comprobaciones automáticas obligatorias". Este workflow cubre la parte
# de base de datos: levanta un PostgreSQL vacío y verifica que el DDL
# ejecute, que los datos de prueba carguen, que las consultas clave
# devuelvan filas y que las restricciones rechacen lo que deben rechazar.
#
# Sólo se dispara cuando cambia algo bajo docs/database/, para no
# interferir con los cambios de código Java.

on:
  push:
    branches: [main]
    paths: ['docs/database/**', '.github/workflows/database.yml']
  pull_request:
    paths: ['docs/database/**', '.github/workflows/database.yml']
  workflow_dispatch:

jobs:
  esquema:
    name: Esquema, datos y restricciones
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d reservas

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: El DDL ejecuta contra una base vacía
        run: $PSQL -v ON_ERROR_STOP=1 -q -f docs/database/schema.sql

      - name: Se crearon las 19 tablas
        run: |
          n=$($PSQL -tAc "select count(*) from information_schema.tables where table_schema='public'")
          echo "tablas creadas: $n"
          test "$n" -eq 19

      - name: El DDL es idempotente
        run: $PSQL -v ON_ERROR_STOP=1 -q -f docs/database/schema.sql

      - name: Los datos de prueba cargan
        run: $PSQL -v ON_ERROR_STOP=1 -q -f docs/database/seed.sql

      - name: Las consultas clave devuelven filas
        run: |
          salida=$($PSQL -v ON_ERROR_STOP=1 -f docs/database/consultas-clave.sql)
          echo "$salida"
          n=$(echo "$salida" | grep -cE '^\([0-9]+ row')
          echo "consultas con resultado: $n"
          test "$n" -eq 14

      - name: Las restricciones rechazan lo que deben rechazar
        run: |
          salida=$($PSQL -f docs/database/pruebas-integridad.sql 2>&1)
          echo "$salida"
          rechazos=$(echo "$salida" | grep -cE '^ERROR:')
          coladas=$(echo "$salida" | grep -cE '^(INSERT|UPDATE|DELETE)')
          echo "rechazos: $rechazos · instrucciones que pasaron: $coladas"
          test "$rechazos" -eq 18
          test "$coladas" -eq 0

      - name: La seguridad de fila queda habilitada
        run: |
          $PSQL -v ON_ERROR_STOP=1 -q -f docs/database/rls.sql
          n=$($PSQL -tAc "select count(*) from pg_class where relnamespace='public'::regnamespace and relkind='r' and relrowsecurity")
          echo "tablas con RLS: $n"
          test "$n" -eq 19
