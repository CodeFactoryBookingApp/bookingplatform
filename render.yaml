services:
  - type: web
    name: bookingplatform-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Solo redespliega cuando cambia el backend; los cambios en front/ (Vercel) no lo disparan.
    buildFilter:
      paths:
        - src/**
        - pom.xml
        - Dockerfile
        - .dockerignore
        - render.yaml
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
