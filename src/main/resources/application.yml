spring:
  application:
    name: bookingplatform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookingplatform}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Databases created before Flyway (Supabase and local ones from Sprint 1)
    # already hold the schema but no history table. Baseline 0 marks them as
    # predating V1, so V1 and V2, which are idempotent, still run on them and
    # create whatever is missing. A new empty database just migrates (ADR-0006).
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema in every profile; Hibernate only checks that
      # the entity mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  # The SMTP server comes from SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME
  # and SPRING_MAIL_PASSWORD. Without SPRING_MAIL_HOST there is no mail sender and the
  # notification module logs each email instead of sending it (ADR-0007).
  mail:
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

app:
  supabase:
    url: ${SUPABASE_URL:https://placeholder.supabase.co}
    secret-key: ${SUPABASE_SECRET_KEY:}
  security:
    jwt-issuer: ${SUPABASE_URL:https://placeholder.supabase.co}/auth/v1
    jwks-uri: ${SUPABASE_URL:https://placeholder.supabase.co}/auth/v1/.well-known/jwks.json
  auth-policy:
    max-failed-attempts: 5
    lock-window-minutes: 15
  mail:
    # Sender address. Empty means the SMTP username, which is what Gmail requires.
    from: ${APP_MAIL_FROM:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  # Render and other PaaS inject the listening port via $PORT; default 8080 locally.
  port: ${PORT:8080}
  error:
    include-message: never
  shutdown: graceful

logging:
  level:
    com.codefactory.bookingplatform: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId:-no-trace}] %c{1} : %m%n"
